pre-commit:
  parallel: true
  commands:
    privacy:
      run: python3 scripts/check_privacy.py --staged
    secrets:
      run: make secrets-staged
    fmt-check:
      run: make fmt-check
    lint:
      run: make lint
    test:
      run: make test

pre-push:
  parallel: true
  commands:
    test:
      run: make test
